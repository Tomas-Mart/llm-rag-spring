# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ МОДУЛЬНЫХ ТЕСТОВ
# ============================================================
# Используется для быстрых модульных тестов с моками.
# ============================================================

spring:
  # Импортируем общие настройки
  config:
    import: application-test-common.yml

  application:
    name: llm-rag-spring-test

  # ============================================================
  # НАСТРОЙКА ПУЛА СОЕДИНЕНИЙ (специфичная для модульных тестов)
  # ============================================================
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  # ============================================================
  # НАСТРОЙКА JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true

  # ============================================================
  # FLYWAY - ОТКЛЮЧЕН
  # ============================================================
  flyway:
    enabled: false

  # ============================================================
  # СПЕЦИФИЧНЫЕ ДЛЯ ТЕСТОВ НАСТРОЙКИ VECTORSTORE
  # ============================================================
  ai:
    vectorstore:
      pgvector:
        drop-table: true
        initialize-schema: true

# ============================================================
# НАСТРОЙКА ЛОГИРОВАНИЯ
# ============================================================
logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.rag: DEBUG