# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ МОДУЛЬНЫХ ТЕСТОВ
# ============================================================
# Профессиональный подход:
# - AI компоненты ОТКЛЮЧЕНЫ
# - H2 in-memory база данных
# - ИСКЛЮЧЕНА автоконфигурация VectorStore
# - НЕ импортирует общие настройки (чтобы не переопределить H2)
# ============================================================

spring:
  application:
    name: llm-rag-spring-test

  # ============================================================
  # НАСТРОЙКА БАЗЫ ДАННЫХ - H2 IN-MEMORY
  # ============================================================
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # НАСТРОЙКА JPA / HIBERNATE
  # ============================================================
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false

  # ============================================================
  # FLYWAY - ОТКЛЮЧЕН
  # ============================================================
  flyway:
    enabled: false

  # ============================================================
  # AI КОМПОНЕНТЫ - ОТКЛЮЧЕНЫ
  # ============================================================
  ai:
    ollama:
      enabled: false
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}

    vectorstore:
      enabled: false
      pgvector:
        index-type: HNSW
        distance-type: EUCLIDEAN_DISTANCE
        dimensions: 768
        table-name: vector_store
        initialize-schema: true
        drop-table: true
        schema-name: public

  # ============================================================
  # ИСКЛЮЧАЕМ АВТОКОНФИГУРАЦИЮ VECTORSTORE
  # ============================================================
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# ============================================================
# ЛОГИРОВАНИЕ
# ============================================================
logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.rag: DEBUG