# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ МОДУЛЬНЫХ ТЕСТОВ
# ============================================================
# Используется для быстрых модульных тестов с моками.
# Подключается к существующему контейнеру PostgreSQL.
# ============================================================

spring:
  application:
    name: llm-rag-spring-test

  # ============================================================
  # НАСТРОЙКА ПОДКЛЮЧЕНИЯ К БАЗЕ ДАННЫХ
  # ============================================================
  # Использует существующий контейнер PostgreSQL с pgvector
  # Порт 32768 - динамический порт, назначенный Docker
  # ============================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:32768/rag_integration_test
    username: test_user
    password: test_password
    hikari:
      maximum-pool-size: 5          # Максимальное количество соединений
      minimum-idle: 2               # Минимальное количество простаивающих соединений
      connection-timeout: 30000     # Таймаут подключения (30 секунд)

  # ============================================================
  # НАСТРОЙКА JPA / HIBERNATE
  # ============================================================
  # create-drop - создает схему при старте и удаляет при завершении
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20            # Размер пакета для массовых операций
        order_inserts: true         # Оптимизация вставок

  # ============================================================
  # FLYWAY - ОТКЛЮЧЕН ДЛЯ МОДУЛЬНЫХ ТЕСТОВ
  # ============================================================
  # В модульных тестах используем Hibernate ddl-auto
  # ============================================================
  flyway:
    enabled: false

  # ============================================================
  # НАСТРОЙКА AI КОМПОНЕНТОВ (OLLAMA)
  # ============================================================
  # Используется существующий контейнер Ollama на порту 11434
  # ============================================================
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:7b    # Модель для чата
          temperature: 0.2           # Температура (креативность)
          num-ctx: 4096              # Размер контекста
      embedding:
        options:
          model: nomic-embed-text:v1.5  # Модель для эмбеддингов

    # ============================================================
    # НАСТРОЙКА ВЕКТОРНОГО ХРАНИЛИЩА (PGVECTOR)
    # ============================================================
    vectorstore:
      pgvector:
        index-type: HNSW             # Тип индекса для векторов
        distance-type: EUCLIDEAN_DISTANCE  # Тип расстояния
        dimensions: 768              # Размерность векторов
        table-name: vector_store     # Имя таблицы
        drop-table: true             # Удалять таблицу при каждом запуске
        initialize-schema: true      # Создавать схему автоматически

# ============================================================
# НАСТРОЙКА ЛОГИРОВАНИЯ
# ============================================================
logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.jdbc: DEBUG
    org.hibernate.SQL: DEBUG
    com.example.rag: DEBUG