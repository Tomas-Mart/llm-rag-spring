# ============================================================
# ОБЩИЕ НАСТРОЙКИ ДЛЯ ВСЕХ ТЕСТОВ
# ============================================================
# Содержит конфигурации, общие для модульных и интеграционных тестов.
# Импортируется в конкретные профили.
# ============================================================

spring:
  # ============================================================
  # НАСТРОЙКИ БУДУТ ПЕРЕОПРЕДЕЛЕНЫ ЧЕРЕЗ @DynamicPropertySource
  # ============================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    # Эти значения будут переопределены Testcontainers
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/rag_integration_test}
    username: ${TEST_DB_USER:test_user}
    password: ${TEST_DB_PASSWORD:test_password}

    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # AI КОМПОНЕНТЫ (OLLAMA)
  # ============================================================
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}

    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: EUCLIDEAN_DISTANCE
        dimensions: 768
        table-name: vector_store