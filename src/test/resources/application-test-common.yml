# ============================================================
# ОБЩИЕ НАСТРОЙКИ ДЛЯ ВСЕХ ТЕСТОВ
# ============================================================
# Содержит конфигурации, общие для модульных и интеграционных тестов.
# Импортируется в конкретные профили.
# ВНИМАНИЕ: Для модульных тестов эти настройки переопределяются!
# ============================================================

spring:
  # ============================================================
  # ПОДКЛЮЧЕНИЕ К БАЗЕ ДАННЫХ
  # ============================================================
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:32769/rag_integration_test}
    username: ${TEST_DB_USER:test_user}
    password: ${TEST_DB_PASSWORD:test_password}

    # ============================================================
    # НАСТРОЙКА ПУЛА СОЕДИНЕНИЙ HIKARI
    # ============================================================
    hikari:
      connection-timeout: 30000      # Таймаут подключения (30 секунд)
      idle-timeout: 600000           # Время простоя перед закрытием (10 минут)
      max-lifetime: 1800000          # Максимальное время жизни соединения (30 минут)

  # ============================================================
  # AI КОМПОНЕНТЫ (OLLAMA)
  # ============================================================
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}

    # ============================================================
    # ВЕКТОРНОЕ ХРАНИЛИЩЕ (PGVECTOR)
    # ============================================================
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: EUCLIDEAN_DISTANCE
        dimensions: 768
        table-name: vector_store