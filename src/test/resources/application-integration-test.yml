# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ ИНТЕГРАЦИОННЫХ ТЕСТОВ
# ============================================================
# Используется для полноценных интеграционных тестов.
# Flyway включен для управления схемой.
# ============================================================

spring:
  # Импортируем общие настройки
  config:
    import: application-test-common.yml

  application:
    name: llm-rag-spring-integration-test

  # ============================================================
  # НАСТРОЙКА ПУЛА СОЕДИНЕНИЙ (специфичная для интеграционных тестов)
  # ============================================================
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ============================================================
  # НАСТРОЙКА JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: true

  # ============================================================
  # НАСТРОЙКА FLYWAY
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

  # ============================================================
  # СПЕЦИФИЧНЫЕ ДЛЯ ИНТЕГРАЦИОННЫХ ТЕСТОВ НАСТРОЙКИ
  # ============================================================
  ai:
    vectorstore:
      pgvector:
        drop-table: false
        initialize-schema: true
        schema-name: public

# ============================================================
# НАСТРОЙКА ЛОГИРОВАНИЯ
# ============================================================
logging:
  level:
    org.springframework.ai: INFO
    org.springframework.jdbc: INFO
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    com.example.rag: DEBUG
    org.flywaydb: INFO