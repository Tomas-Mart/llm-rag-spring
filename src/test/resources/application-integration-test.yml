# ============================================================
# КОНФИГУРАЦИЯ ДЛЯ ИНТЕГРАЦИОННЫХ ТЕСТОВ
# ============================================================
# Использует Testcontainers для PostgreSQL
# ============================================================

spring:
  config:
    import: optional:application-test-common.yml

  application:
    name: llm-rag-spring-integration-test

  # ============================================================
  # AI КОМПОНЕНТЫ
  # ============================================================
  ai:
    ollama:
      enabled: true
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: 0.2
          num-ctx: 4096
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:v1.5}

    vectorstore:
      enabled: true
      pgvector:
        index-type: HNSW
        distance-type: EUCLIDEAN_DISTANCE
        dimensions: 768
        table-name: vector_store
        initialize-schema: true
        drop-table: false
        schema-name: public

  # ============================================================
  # НАСТРОЙКА JPA / HIBERNATE
  # ============================================================
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: true

  # ============================================================
  # FLYWAY
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: false
    clean-on-validation-error: true

# ============================================================
# ЛОГИРОВАНИЕ
# ============================================================
logging:
  level:
    org.springframework.ai: INFO
    org.springframework.jdbc: INFO
    org.springframework.transaction: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.stat: DEBUG
    com.example.rag: DEBUG
    org.flywaydb: INFO
    org.testcontainers: INFO