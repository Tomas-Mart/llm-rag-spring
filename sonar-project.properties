# ============================================================
# \u041E\u0421\u041D\u041E\u0412\u041D\u042B\u0415 \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418
# ============================================================
sonar.projectKey=Tomas-Mart_llm-rag-spring
sonar.projectName=RAG Spring Application
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io
sonar.organization=tomas-mart
# ============================================================
# \u0418\u0421\u0422\u041E\u0427\u041D\u0418\u041A\u0418 \u0418 \u0422\u0415\u0421\u0422\u042B
# ============================================================
sonar.sources=src/main/java,src/main/resources
sonar.tests=src/test/java
sonar.java.source=21
sonar.language=java
# \u0414\u041E\u0411\u0410\u0412\u041B\u0415\u041D\u041E: \u041F\u0443\u0442\u0438 \u043A \u0441\u043A\u043E\u043C\u043F\u0438\u043B\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u043C \u043A\u043B\u0430\u0441\u0441\u0430\u043C
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
# ============================================================
# \u041F\u0423\u0422\u0418 \u041A \u0422\u0415\u0421\u0422\u0410\u041C
# ============================================================
sonar.test.inclusions=\
  **/*Test.java,\
  **/*IntegrationTest.java,\
  **/*IT.java
# ============================================================
# \u0418\u0421\u041A\u041B\u042E\u0427\u0415\u041D\u0418\u042F \u0414\u041B\u042F \u041F\u041E\u041A\u0420\u042B\u0422\u0418\u042F
# ============================================================
sonar.coverage.exclusions=\
  **/config/**/*.java,\
  **/entity/**/*.java,\
  **/exception/**/*.java,\
  **/dto/**/*.java,\
  **/model/**/*.java,\
  **/Application.java
# ============================================================
# \u041D\u0410\u0421\u0422\u0420\u041E\u0419\u041A\u0418 JACOCO
# ============================================================
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=\
  target/site/jacoco/jacoco.xml,\
  target/site/jacoco-it/jacoco.xml
# ============================================================
# \u041F\u0423\u0422\u0418 \u041A \u041E\u0422\u0427\u0415\u0422\u0410\u041C \u0422\u0415\u0421\u0422\u041E\u0412
# ============================================================
sonar.junit.reportPaths=\
  target/surefire-reports,\
  target/failsafe-reports
# ============================================================
# \u0418\u0421\u041A\u041B\u042E\u0427\u0415\u041D\u0418\u042F \u0414\u041B\u042F \u0410\u041D\u0410\u041B\u0418\u0417\u0410
# ============================================================
sonar.exclusions=\
  **/generated/**/*.java,\
  **/model/**/*.java
# ============================================================
# \u041F\u041E\u0420\u041E\u0413\u0418 \u041A\u0410\u0427\u0415\u0421\u0422\u0412\u0410
# ============================================================
sonar.coverage.threshold=30
# ============================================================
# \u0418\u0421\u041A\u041B\u042E\u0427\u0415\u041D\u0418\u042F \u0414\u041B\u042F \u0414\u0423\u0411\u041B\u0418\u0420\u041E\u0412\u0410\u041D\u0418\u042F
# ============================================================
sonar.cpd.exclusions=\
  **/config/**/*.java,\
  **/entity/**/*.java,\
  **/exception/**/*.java
# ============================================================
# \u0418\u041D\u0422\u0415\u0413\u0420\u0410\u0426\u0418\u042F \u0421 GITHUB
# ============================================================
sonar.github.repository=Tomas-Mart/llm-rag-spring