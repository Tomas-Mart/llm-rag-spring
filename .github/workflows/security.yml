name: Security Scan

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  dependency-check:
    name: 🔒 Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache OWASP Data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-owasp-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-owasp-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -n "$NVD_API_KEY" ]; then
            echo "✅ Using NVD API Key"
            mvn org.owasp:dependency-check-maven:check \
              -DnvdApiKey=$NVD_API_KEY \
              -DfailBuildOnCVSS=7 \
              -Dformat=HTML \
              -Dformat=JSON \
              -DassemblyAnalyzerEnabled=false \
              -DnodeAnalyzerEnabled=false \
              -DretireJsAnalyzerEnabled=false || true
          else
            echo "⚠️ No NVD API Key found, using public rate limits"
            mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -Dformat=HTML \
              -Dformat=JSON || true
          fi

      - name: Check for Critical vulnerabilities
        run: |
          if [ -f target/dependency-check-report.json ]; then
            CRITICAL=$(grep -c '"severity":"CRITICAL"' target/dependency-check-report.json || echo "0")
            HIGH=$(grep -c '"severity":"HIGH"' target/dependency-check-report.json || echo "0")
          
            echo "📊 Found $CRITICAL CRITICAL and $HIGH HIGH vulnerabilities"
          
            if [ "$CRITICAL" -gt 0 ]; then
              echo "❌ CRITICAL vulnerabilities found! Build failed."
              exit 1
            fi
          
            if [ "$HIGH" -gt 5 ]; then
              echo "⚠️ Too many HIGH vulnerabilities found: $HIGH"
              exit 1
            fi
          else
            echo "⚠️ No report file found"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json

      - name: Notify on vulnerabilities
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_ICON: https://github.com/github.png
          SLACK_USERNAME: GitHub Actions
          SLACK_TITLE: 🔒 Security Alert!
          SLACK_MESSAGE: |
            • Repository: ${{ github.repository }}
            • Branch: ${{ github.ref_name }}
            • Commit: ${{ github.sha }}
            • Author: ${{ github.event.head_commit.author.name }}
            • Status: ❌ Vulnerabilities found!
            • Report: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}