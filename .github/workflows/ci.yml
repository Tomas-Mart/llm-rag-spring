name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  MAVEN_OPTS: '-Xmx2048m'
  DOCKER_REGISTRY: ghcr.io
  SONAR_ORGANIZATION: 'tomas-mart'
  SONAR_PROJECT_KEY: 'Tomas-Mart_llm-rag-spring'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 1. BUILD
  # ============================================
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build
        run: mvn clean compile -DskipTests -B

      - name: Upload classes
        uses: actions/upload-artifact@v4
        with:
          name: classes
          path: target/classes/
          retention-days: 1

  # ============================================
  # 2. UNIT TESTS
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run Unit Tests
        run: |
          mvn test -Punit-tests \
            -Dspring.profiles.active=test \
            -DfailIfNoTests=false \
            -B

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Publish report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

  # ============================================
  # 3. INTEGRATION TESTS
  # ============================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    continue-on-error: true
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Pre-pull Docker images
        run: |
          docker pull pgvector/pgvector:pg16 || true

      - name: Run Integration Tests
        run: |
          mvn verify -Pintegration-tests \
            -Dspring.profiles.active=integration-test \
            -DfailIfNoTests=false \
            -Dmaven.test.failure.ignore=true \
            -Dtest="!**/*PerformanceTest.java" \
            -B

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  # ============================================
  # 4. SONARCLOUD
  # ============================================
  sonarcloud:
    name: 📊 SonarCloud
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -B

  # ============================================
  # 5. DOCKER BUILD (ONLY MAIN)
  # ============================================
  docker-build:
    name: 🐳 Docker
    runs-on: ubuntu-latest
    needs: sonarcloud
    if: github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -B

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # 6. DEPLOY (ONLY MAIN) - ИСПРАВЛЕНО
  # ============================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://llm-rag-spring.example.com
    steps:
      - name: Deploy with SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}:latest
            cd /opt/app || exit 1
            docker compose up -d --no-deps
            docker system prune -f

  # ============================================
  # 7. NOTIFY
  # ============================================
  notify:
    name: 📨 Notify
    runs-on: ubuntu-latest
    needs: [ build, unit-tests, integration-tests, sonarcloud, docker-build, deploy ]
    if: always()
    steps:
      - name: Set status
        id: status
        run: |
          if [[ "${{ needs.build.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Slack Notification
        uses: rtCamp/action-slack-notify@v2
        if: github.event_name != 'pull_request'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_ICON: https://github.com/github.png
          SLACK_USERNAME: GitHub Actions
          SLACK_TITLE: ${{ steps.status.outputs.emoji }} Build #${{ github.run_number }}
          SLACK_MESSAGE: |
            • Repository: ${{ github.repository }}
            • Branch: ${{ github.ref_name }}
            • Commit: ${{ github.sha }}
            • Author: ${{ github.event.head_commit.author.name }}
            • Status: ${{ steps.status.outputs.status }}
            • URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            📊 Test Results:
            • Unit Tests: ${{ needs.unit-tests.result }}
            • Integration Tests: ${{ needs.integration-tests.result }}
            • SonarCloud: ${{ needs.sonarcloud.result }}
            
            🐳 Docker: ${{ needs.docker-build.result }}
            🚀 Deploy: ${{ needs.deploy.result }}